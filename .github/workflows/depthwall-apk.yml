name: DepthWall APK

on:
  push:
    paths:
      - "depthwall/**"
      - ".github/workflows/depthwall-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: depthwall
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verificar URL do modelo de IA
        run: |
          curl -fsSIL "https://huggingface.co/onnx-community/depth-anything-v2-small/resolve/main/onnx/model_quantized.onnx" \
            | grep -iE "^(HTTP|content-length|location)" || (echo "Modelo não encontrado" && exit 1)

      - name: Compilar APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DepthWall-prototipo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DepthWall-prototipo
          path: depthwall/DepthWall-prototipo.apk

      - name: Publicar para download (release "prototipo")
        uses: softprops/action-gh-release@v2
        with:
          tag_name: depthwall-prototipo
          name: DepthWall – protótipo
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            APK de teste do DepthWall (build ${{ github.sha }}).
            Baixe `DepthWall-prototipo.apk` no celular e instale (permita "instalar apps desconhecidos").
          files: depthwall/DepthWall-prototipo.apk
